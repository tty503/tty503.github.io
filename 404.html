<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — tty503</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0A0A0A" />
<style>
  :root{
    --bg:#0A0A0A; --line:#2E2E2E; --dim:#6b6b6b; --mid:#7A7A7A; --light:#C2C2C2; --white:#F0F0F0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ background:#000; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--light); font-family:var(--mono);
    font-size:14px; line-height:1.7; padding:24px;
  }
  main{ width:100%; max-width:640px; border:1px solid var(--line); padding:28px; }
  .label{ color:var(--dim); font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
  h1{ margin:8px 0 14px; font-size:clamp(22px,6vw,36px); font-weight:400; color:var(--white); }
  h1::before{ content:"> "; color:var(--dim); }
  p{ margin:0 0 14px; color:var(--mid); }
  a{ color:var(--white); text-decoration:none; border-bottom:1px solid var(--line); }
  a:hover{ border-bottom-color:var(--white); }
  pre{ margin:18px 0 0; padding:12px; border-left:1px solid var(--line); color:var(--dim); font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <span class="label">[ tty503 ]</span>
  <h1>404 — ruta no encontrada</h1>
  <p>La ruta que buscas no existe, se movió o nunca estuvo aquí.</p>
  <p><a href="/">Volver al inicio</a> · <a href="/#contacto">Contacto</a> · <a href="/pgp/tty503.asc">Clave PGP</a></p>

tty503@home:/$ ls
whoami  trayectoria  foco  registro  stack  bitacora  firma  contacto</pre>
</main>
</body>
</html>
